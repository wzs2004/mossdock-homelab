<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>书籍匹配 · 服务器设置</title>
<style>
body{font:15px/1.55 system-ui,-apple-system,sans-serif;max-width:700px;margin:35px auto;padding:0 20px;background:#0e1929;color:#eaf4fa}
h1{font-size:24px}p{color:#a5bfcd}label{display:block;margin:22px 0 6px;font-weight:600}
input{box-sizing:border-box;width:100%;padding:11px 12px;background:#172c41;color:white;border:1px solid #526779;border-radius:8px}
button{padding:11px 18px;background:#13836b;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer;margin-top:19px}
button:disabled{opacity:.5}a{color:#7de7d1}#status{white-space:pre-wrap;margin-top:16px;color:#9fe5bd}
</style>
</head>
<body>
<h1>Audiobookshelf · 书籍匹配</h1>
<p>连接到已经运行的 Audiobookshelf 和书籍工具服务。使用服务器的 HTTPS 域名，无须安装 Tailscale。</p>
<form id="settings">
<label for="absUrl">Audiobookshelf 网址</label><input id="absUrl" placeholder="https://books6.mossdock.autos" required>
<label for="managerUrl">书籍工具服务网址</label><input id="managerUrl" placeholder="https://books6.mossdock.autos/__ext/asr" required>
<label for="managerKey">书籍工具服务密钥（仅保存在此浏览器）</label><input id="managerKey" type="password" autocomplete="off" required>
<button type="submit">保存并授权连接</button> <button type="button" id="resetDefaults">恢复默认地址</button> <button type="button" id="openAbs">打开 Audiobookshelf</button>
<div id="status" role="status"></div>
<p id="defaults" class="hint"></p>
</form>
<p>配置会保存在浏览器的扩展本地存储中，不会上传到 GitHub。使用受密钥保护的 HTTPS 书籍工具接口。</p>
<script src="config.js"></script>
<script src="options.js"></script>
<script>document.getElementById("resetDefaults")?.addEventListener("click", async () => { await chrome.storage.local.set({absUrl: ABS_URL, managerUrl: MANAGER_URL, customDomain: false}); location.reload(); });</script>
</body></html>
