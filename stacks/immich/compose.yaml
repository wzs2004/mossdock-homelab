name: immich
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.5}
    volumes:
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind: { create_host_path: false }
      - /etc/localtime:/etc/localtime:ro
    env_file: [.env]
    ports: ["127.0.0.1:${IMMICH_PORT:-12283}:2283"]
    depends_on: [redis, database]
    restart: unless-stopped
    networks: [immich]
  immich-gate:
    container_name: immich_gate
    image: local/immich-gate:1
    build: { context: ./gate, dockerfile: Dockerfile }
    restart: unless-stopped
    ports: ["${IMMICH_PUBLIC_PORT:-2283}:2283"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      IDLE_SECONDS: "${IMMICH_IDLE_SECONDS:-1800}"
      READY_TIMEOUT: '90'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt: [no-new-privileges:true]
    networks: [immich]
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.5}
    volumes: [model-cache:/cache]
    env_file: [.env]
    restart: unless-stopped
    networks: [immich]
  redis:
    container_name: immich_redis
    image: valkey/valkey:9
    restart: unless-stopped
    networks: [immich]
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'SSD'
    volumes:
      - type: bind
        source: ${DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --dbname=${DB_DATABASE_NAME:-immich} --username=${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [immich]
volumes:
  model-cache:
networks:
  immich:
    name: ${IMMICH_NETWORK:-mossdock-immich}
