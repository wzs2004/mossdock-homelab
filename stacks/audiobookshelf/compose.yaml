name: abs
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ABS_PORT:-13378}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 数据库与元数据在命名卷里（内置 SSD）；媒体库仍在机械盘。
      - type: volume
        source: abs-config
        target: /config
      - type: volume
        source: abs-metadata
        target: /metadata
      - type: bind
        source: ${ABS_DATA:-/Volumes/NAS/Apps/Audiobookshelf}/audiobooks
        target: /audiobooks
        bind: { create_host_path: false }
      - type: bind
        source: ${ABS_DATA:-/Volumes/NAS/Apps/Audiobookshelf}/audiobooks115
        target: /audiobooks115
        bind: { create_host_path: false }
    networks: [abs]
volumes:
  abs-config:
    external: true
  abs-metadata:
    external: true
networks:
  abs:
    name: ${ABS_NETWORK:-mossdock-abs}
