name: abs-manager
services:
  transcription-manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    image: local/audiobookshelf-transcription-manager:1
    container_name: transcription-manager
    restart: unless-stopped
    init: true
    environment:
      WHISPER_MODEL: /models/${WHISPER_MODEL_FILE:-ggml-large-v3-turbo-q5_0.bin}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-en}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      CHUNK_SECONDS: 120
      NATIVE_ASR_URL: ${NATIVE_ASR_URL:-}
      NATIVE_ASR_KEY: ${NATIVE_ASR_KEY:-}
      ABS_BASE_URL: http://audiobookshelf:80
      ABS_API_TOKEN: ${ABS_API_TOKEN:?set ABS_API_TOKEN in .env}
      AUTO_CHAPTERS: '0'
      AUTO_MATCH: '0'
      CHAPTER_REQUIRE_SUBTITLES: '1'
      CHAPTER_SINGLE_FILE: '1'
      AUTO_TRANSCRIBE: '0'
      AUTO_SETTLE_SECONDS: ${AUTO_SETTLE_SECONDS:-300}
      AUTO_SCAN_SECONDS: ${AUTO_SCAN_SECONDS:-60}
      EXTENSION_TOKEN: ${EXTENSION_TOKEN:?set EXTENSION_TOKEN in .env}
    volumes:
      - ${ABS_DATA:-/Volumes/NAS/Apps/Audiobookshelf}/audiobooks:/audiobooks
      - ${ABS_DATA:-/Volumes/NAS/Apps/Audiobookshelf}/audiobooks115:/audiobooks115
      - ${MODEL_DIR:-/Volumes/NAS/Apps/whisper-models}:/models:ro
      - ${MANAGER_DATA:-/Volumes/NAS/Apps/Audiobookshelf/transcription-manager}/data/transcription-manager:/data
      - ${MANAGER_DATA:-/Volumes/NAS/Apps/Audiobookshelf/transcription-manager}/data/transcripts:/chapter-transcripts:ro
    networks: [abs]
networks:
  abs:
    external: true
    name: ${ABS_NETWORK:-mossdock-abs}
